name: Compila la mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - name: Estrai e compila
        run: |
          unzip -q -o "$(ls *.zip | head -n 1)" -d progetto
          cd "$(dirname "$(find progetto -name settings.gradle | head -n 1)")"
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: caos-inventario
          path: progetto/**/build/libs/*.jar
